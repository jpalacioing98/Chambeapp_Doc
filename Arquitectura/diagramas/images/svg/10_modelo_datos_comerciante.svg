lengthAdjust="spacing" textLength="196.7202" x="683" y="367.7231">HORARIOS Y REPUTACI&#211;N (3):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="966.291" x="683" y="382.856">3. negocio_horarios         &#8594; PK id, negocio_id FK, dia_semana[0-6], abierto, hora_apertura, hora_cierre (UNIQUE negocio_id, dia_semana, ordenados)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1038.8701" x="683" y="397.9888">4. negocio_ratings          &#8594; PK id, negocio_id FK, autor_id FK, puntaje[1-5], comentario, reportado, creado_en (UNIQUE negocio_id, autor_id, CHECK puntaje 1-5)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1445.4819" x="683" y="413.1216">5. negocio_reportes         &#8594; PK id, negocio_id FK, reporter_id FK, tipo[fraude/spam/contenido_inapropiado/servicio_no_prestado/otro], descripcion, estado[abierto/investigando/resuelto/desestimado], ticket_id FK, creado_en</text><path d="M930,431.1875 L930,486.1875 L2530,486.1875 L2530,441.1875 L2520,431.1875 L930,431.1875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2520,431.1875 L2520,441.1875 L2530,441.1875 L2520,431.1875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.6499" x="936" y="448.2544">NUEVAS ENTIDADES MERCHANT (2):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1579.1001" x="936" y="463.3872">6. merchant_preferences     &#8594; PK id, user_id FK UK, notif_nueva_solicitud, notif_nueva_resena, notif_estado_kyc, notif_pago_recibido, push_enabled, email_digest[daily/weekly/never], idioma, tema[system/light/dark], creado_en/actualizado_en</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="991.5293" x="936" y="478.52">7. merchant_payment_methods &#8594; PK id, user_id FK, tipo[nequi/bancolombia/efectivo...], detalle JSON (numero, titular, etc.), principal, activo, creado_en</text><path d="M306,496.5859 L306,611.5859 L752,611.5859 L752,506.5859 L742,496.5859 L306,496.5859" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M742,496.5859 L742,506.5859 L752,506.5859 L742,496.5859" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.0962" x="312" y="513.6528">RELACIONES:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.46" x="312" y="528.7856">User (1) &#9472;&#9472; (1) Negocio : owner_id</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.1904" x="312" y="543.9185">Negocio (1) &#9472;&#9472; (7) NegocioHorario : dia_semana 0-6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.3384" x="312" y="559.0513">Negocio (1) &#9472;&#9472; (*) NegocioRating : calificaciones clientes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.8252" x="312" y="574.1841">Negocio (1) &#9472;&#9472; (*) NegocioReporte : quejas/reportes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.6099" x="312" y="589.3169">User (1) &#9472;&#9472; (1) MerchantPreference : preferencias notif/UI</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="425.5532" x="312" y="604.4497">User (1) &#9472;&#9472; (*) MerchantPaymentMethod : m&#233;todos pago negocio</text><path d="M482,622.5156 L482,737.5156 L918,737.5156 L918,632.5156 L908,622.5156 L482,622.5156" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M908,622.5156 L908,632.5156 L918,632.5156 L908,622.5156" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.7778" x="488" y="639.5825">&#205;NDICES CLAVE:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.8442" x="488" y="654.7153">&#8226; ix_negocios_owner_id (FK)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.2261" x="488" y="669.8481">&#8226; ix_negocios_slug (UK)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="415.5049" x="488" y="684.981">&#8226; ix_negocios_geom (GIST PostGIS para b&#250;squedas proximidad)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="367.0278" x="488" y="700.1138">&#8226; ix_negocios_estado_categoria (compuesto para filtros)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.75" x="488" y="715.2466">&#8226; ix_negocio_horarios_negocio_dia (UK)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.6182" x="488" y="730.3794">&#8226; ix_negocio_ratings_negocio_autor (UK)</text><path d="M191,748.4453 L191,894.4453 L1034,894.4453 L1034,758.4453 L1024,748.4453 L191,748.4453" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1024,748.4453 L1024,758.4453 L1034,758.4453 L1024,748.4453" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.4966" x="390.9197" y="765.5122">FLUJO MERCHANT ONBOARDING:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.8237" x="390.9197" y="780.645">1. User.register(rol=MERCHANT) &#8594; users</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="419.6689" x="390.9197" y="795.7778">2. POST /merchant/negocios &#8594; crear Negocio (estado=borrador)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="385.5947" x="390.9197" y="810.9106">3. Subir logo/banner/imagenes &#8594; MinIO &#8594; URLs en Negocio</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.4912" x="390.9197" y="826.0435">4. Configurar horarios &#8594; NegocioHorario (7 d&#237;as)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.3115" x="390.9197" y="841.1763">5. KYC negocio &#8594; NegocioKYCDocumento (docs requeridos)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="435.1128" x="390.9197" y="856.3091">6. Verificador aprueba &#8594; Negocio.estado=ACTIVO, verificado=true</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.6655" x="390.9197" y="871.4419">7. Configurar MerchantPreference + MerchantPaymentMethod</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.6919" x="390.9197" y="886.5747">8. Publicar AnuncioLaboral / recibir Solicitudes cercanas</text><!--SRC=[ZLTBRzj64BxxLmnoaXDPZFCi3AI08ik9ObjozN0I606n95VInYINsLtQSKyvzTPBsr_GMmyzzTQh_qb-IR_XIxAhF0m398Upmtbyyyt8AHTBEb2Bt0ZQlKyxTAmZ6MkA9EqBf-qU7L__4-MGz7GYJQX4wYIrXdAXGwKjtQDZI9UGRczjYT1fGtVsdtV9ewxva2id8Rf3mXA4MvamJeKgWpRTwOs6q_wRwOXcarbtF1XHQtUxqEnDtzpK7FPVZ7fGw8t6_KOBmfjQBqTZDZEXjpJkdyoctTxW-lSXjHwM-dXzo-giVzgTK7yu7Untz_iJEkwFUo-xmocr7jIVUBsrnS7i_CXExT7Cvi8eJO6maaATaj5nSwpMX6DxrBTE1B4CLQ9awZGjf8vrA6BriuXqhGcNzkYbDcpJafM9I4KiEQT6E9KkYZkPQUEaNLb_lKSdHiwbaIcgKLJW-Y-d8vX0qJAnq5jRgKQHZ5ei7UbvaL2YJVdUWtotGxcLnb8BqJohezac_llyoszqSaWgQXEyKt4Rzgszr2Roby8ksuGmNMxRd0ZfNy2AqYcUv09Nduz1fkOgHDHjEhyA_TNpbamZOaTlkykL9RfTT7RrGOVI6dYt_zPSrPUfDFWw7HosyOKaC1AUnlc2PX14qeP6PM7XgLEPFWjBP6